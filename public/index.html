<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d1218" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Work Orders" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Icon Remodeling Group - Work Orders</title>
  <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

<body>
<a id="op-center-home-btn" href="https://icon-operations-center.vercel.app" aria-label="Return to Operations Center">
  <span aria-hidden="true" class="op-arrow">&larr;</span>
  <span class="op-label">Operations Center</span>
</a>
<style>
  #op-center-home-btn, .ops-center-home-btn, a[aria-label="Return to Operations Center"] {
    position: fixed !important;
    bottom: 20px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    top: auto !important;
    z-index: 999999 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    padding: 10px 20px !important;
    background: rgba(10,12,18,0.95) !important;
    border: 1px solid #C9A84C !important;
    border-radius: 25px !important;
    color: #ffffff !important;
    font-size: 13px !important;
    text-decoration: none !important;
    white-space: nowrap !important;
  }
</style>
