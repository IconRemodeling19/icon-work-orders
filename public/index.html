<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d1218" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Work Orders" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Icon Remodeling Group - Work Orders</title>
  <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: #fff; } }</style>
</head>
<body>
<a id="op-center-home-btn" href="https://icon-operations-center.vercel.app" aria-label="Return to Operations Center">
  <span aria-hidden="true" class="op-arrow">&larr;</span>
  <span class="op-label">Operations Center</span>
</a>
<style>
  #op-center-home-btn{position:fixed;top:8px;left:8px;z-index:99999;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;background:rgba(10,12,18,.92);color:#fff;text-decoration:none;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;border:1px solid #C9A84C;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:color .15s,border-color .15s;}
  #op-center-home-btn:hover,#op-center-home-btn:focus{color:#E8192C;border-color:#E8192C;outline:none;}
  #op-center-home-btn .op-arrow{font-size:16px;line-height:1;}
  @media print{#op-center-home-btn{display:none!important;}}
  @media (max-width:380px){#op-center-home-btn .op-label{display:none;}#op-center-home-btn{padding:8px 10px;}}
  @media (max-width:768px){#op-center-home-btn{font-size:11px!important;padding:5px 8px!important;opacity:.9;top:4px;left:4px;}}
</style>
<div id="root"></div></body>
</html>
